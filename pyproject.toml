[project]
name = "coderagmanager"
version = "0.1.0"
description = "CodeRagManager (crm): gestor multi-proyecto de code-RAGs con servidor MCP"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "mcp>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-java",
    "lancedb",
    "sentence-transformers",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
crm = "coderagmanager.adapters.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coderagmanager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
